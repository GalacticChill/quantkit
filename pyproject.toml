[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantkit"
version = "0.1.0"
description = "A small quant toolkit: data loaders, return conversions & metrics, factor regressions, and a clean matplotlib style."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GalacticChill", email = "elda.pema@gmail.com" }]
keywords = ["finance", "quant", "fama-french", "returns", "fred", "factor-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/GalacticChill/quantkit"
Issues = "https://github.com/GalacticChill/quantkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: hits the network (run with QUANTKIT_NET=1)"]
testpaths = ["tests"]
